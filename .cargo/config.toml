[toolchain]
channel = "nightly"

[build]
target = "riscv64gc-unknown-none-elf"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tsrc/arch/riscv/link.x",
    "-C", "code-model=medium",
]
runner = "qemu-system-riscv64 -s -machine virt -bios opensbi_v1.8.1.bin -nographic -smp cores=4 -m 1G -kernel"
